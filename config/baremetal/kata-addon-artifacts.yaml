apiVersion: v1
kind: ConfigMap
metadata:
  name: kata-addon-artifacts
  namespace: openshift-sandboxed-containers-operator
data:
  addonImage: "quay.io/ajvictor/kata-se-artifacts:v1.0"
  
  # Required: Provider type (se, tdx, snp, etc.)
  # This determines which config file to update: configuration-<provider>.toml
  provider: "se"
  
  # Optional: Path within the container image where kernel is located
  kernelPath: "/artifacts/kernel/vmlinuz"
  
  # Optional: Path within the container image where initrd is located  
  initrdPath: "/artifacts/initrd/kata-containers-initrd.img"
  
  version: "v1.0"
